name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ----------------------------------------------------
      # 1. BUILD BACKEND (TypeScript -> dist)
      # ----------------------------------------------------
      - name: Install & Build Backend
        run: |
          echo "Building Backend..."
          cd backend
          npm ci
          npm run build
          cd ..

      # ----------------------------------------------------
      # 2. BUILD FRONTEND (Next.js Production Bundle)
      # ----------------------------------------------------
      - name: Prepare Frontend .env & Build
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.bismillahplastic.com/api' }}
          NEXT_PUBLIC_SITE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SITE_DOMAIN || 'bismillahplastic.com' }}
          NEXT_PUBLIC_ADMIN_DOMAIN: ${{ secrets.NEXT_PUBLIC_ADMIN_DOMAIN || 'admin.bismillahplastic.com' }}
        run: |
          echo "Preparing Frontend .env..."
          cd frontend
          if [ -n "$FRONTEND_ENV" ]; then
            printf "%s\n" "$FRONTEND_ENV" > .env
          else
            printf "NODE_ENV=production\nNEXT_PUBLIC_API_URL=%s\nNEXT_PUBLIC_SITE_DOMAIN=%s\nNEXT_PUBLIC_ADMIN_DOMAIN=%s\n" \
              "$NEXT_PUBLIC_API_URL" "$NEXT_PUBLIC_SITE_DOMAIN" "$NEXT_PUBLIC_ADMIN_DOMAIN" > .env
          fi
          echo "Building Frontend..."
          npm ci
          npm run build
          cd ..

      # ----------------------------------------------------
      # 3. PACKAGE BUNDLES LOCALLY
      # ----------------------------------------------------
      - name: Package Backend & Frontend Bundles
        run: |
          echo "Packaging Backend..."
          tar -czf backend-bundle.tar.gz -C backend dist server.js package.json package-lock.json

          echo "Packaging Frontend..."
          mkdir -p frontend/public
          tar -czf frontend-bundle.tar.gz --exclude='.next/cache' -C frontend .next public server.js next.config.ts package.json package-lock.json

          echo "Bundle sizes:"
          du -sh backend-bundle.tar.gz frontend-bundle.tar.gz

      # ----------------------------------------------------
      # 4. WRITE SSH PRIVATE KEY DIRECTLY (no ssh-agent action)
      # ----------------------------------------------------
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add host fingerprint to known_hosts
          ssh-keyscan -p "$SSH_PORT" -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Write SSH config to avoid repeated flag passing
          cat >> ~/.ssh/config << SSHCONF
          Host deploy_target
            HostName $SSH_HOST
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 30
          SSHCONF
          chmod 600 ~/.ssh/config

      # ----------------------------------------------------
      # 5. UPLOAD ALL FILES VIA SFTP BATCH (bypasses SCP subsystem issues)
      # ----------------------------------------------------
      - name: Upload Bundles to Server
        env:
          SSH_USER: ${{ secrets.SSH_USER || 'bismill6' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Uploading bundles via sftp batch..."
          sftp -b - -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=30 \
            -P "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" << SFTP_CMDS
          put backend-bundle.tar.gz /home/$SSH_USER/backend-bundle.tar.gz
          put frontend-bundle.tar.gz /home/$SSH_USER/frontend-bundle.tar.gz
          bye
          SFTP_CMDS
          echo "All bundles uploaded successfully."

      # ----------------------------------------------------
      # 6. WRITE DEPLOY SCRIPT AND UPLOAD IT
      # ----------------------------------------------------
      - name: Prepare & Upload Deploy Script
        env:
          SSH_USER: ${{ secrets.SSH_USER || 'bismill6' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.bismillahplastic.com/api' }}
          NEXT_PUBLIC_SITE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SITE_DOMAIN || 'bismillahplastic.com' }}
          NEXT_PUBLIC_ADMIN_DOMAIN: ${{ secrets.NEXT_PUBLIC_ADMIN_DOMAIN || 'admin.bismillahplastic.com' }}
        run: |
          # Write .env files locally so we can upload them (avoids complex quoting over SSH)
          if [ -n "$BACKEND_ENV" ]; then
            printf "%s\n" "$BACKEND_ENV" > backend.env
          else
            echo "# No BACKEND_ENV secret set" > backend.env
          fi

          if [ -n "$FRONTEND_ENV" ]; then
            printf "%s\n" "$FRONTEND_ENV" > frontend.env
          else
            printf "NODE_ENV=production\nNEXT_PUBLIC_API_URL=%s\nNEXT_PUBLIC_SITE_DOMAIN=%s\nNEXT_PUBLIC_ADMIN_DOMAIN=%s\n" \
              "$NEXT_PUBLIC_API_URL" "$NEXT_PUBLIC_SITE_DOMAIN" "$NEXT_PUBLIC_ADMIN_DOMAIN" > frontend.env
          fi

          # Upload .env files and deploy script via sftp
          sftp -b - -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=30 \
            -P "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" << SFTP_ENV
          put backend.env /home/$SSH_USER/backend.env.new
          put frontend.env /home/$SSH_USER/frontend.env.new
          SFTP_ENV

          # Write the remote deploy script locally, then upload it
          cat > deploy_remote.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "=== Remote Deploy Script Starting ==="

          # Setup PATH for cPanel Node.js installations
          export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/bin"
          for v in 20 22 18 16; do
            if [ -d "/opt/alt/alt-nodejs${v}/root/usr/bin" ]; then
              export PATH="/opt/alt/alt-nodejs${v}/root/usr/bin:$PATH"
              break
            fi
            if [ -d "/opt/cpanel/ea-nodejs${v}/bin" ]; then
              export PATH="/opt/cpanel/ea-nodejs${v}/bin:$PATH"
              break
            fi
          done
          echo "Using Node: $(node -v 2>/dev/null || echo 'not found')"

          export NODE_OPTIONS="--max-old-space-size=512"

          echo "=== 1. Deploying Backend ==="
          mkdir -p "$HOME/backend"
          tar -xzf "$HOME/backend-bundle.tar.gz" -C "$HOME/backend"
          rm -f "$HOME/backend-bundle.tar.gz"

          cd "$HOME/backend"
          if [ ! -d "node_modules" ] || [ "package.json" -nt "node_modules/.package-lock.json" ]; then
            echo "Installing backend npm dependencies..."
            npm install --omit=dev --no-audit --no-fund --prefer-offline --maxsockets=2
          else
            echo "Backend deps up-to-date, skipping install."
          fi

          if [ -f "$HOME/backend.env.new" ]; then
            mv "$HOME/backend.env.new" "$HOME/backend/.env"
            chmod 600 "$HOME/backend/.env"
          fi
          mkdir -p tmp && touch tmp/restart.txt
          echo "Backend deployed and restarted."

          echo "=== 2. Deploying Frontend ==="
          mkdir -p "$HOME/frontend"
          tar -xzf "$HOME/frontend-bundle.tar.gz" -C "$HOME/frontend"
          rm -f "$HOME/frontend-bundle.tar.gz"

          cd "$HOME/frontend"
          if [ ! -d "node_modules" ] || [ "package.json" -nt "node_modules/.package-lock.json" ]; then
            echo "Installing frontend npm dependencies..."
            npm install --omit=dev --no-audit --no-fund --prefer-offline --maxsockets=2
          else
            echo "Frontend deps up-to-date, skipping install."
          fi

          if [ -f "$HOME/frontend.env.new" ]; then
            mv "$HOME/frontend.env.new" "$HOME/frontend/.env"
            chmod 600 "$HOME/frontend/.env"
          fi
          mkdir -p tmp && touch tmp/restart.txt
          echo "Frontend deployed and restarted."

          echo "=== Deployment Completed Successfully! ==="
          SCRIPT

          chmod +x deploy_remote.sh
          sftp -b - -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=30 \
            -P "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" << SFTP_SCRIPT
          put deploy_remote.sh /home/$SSH_USER/deploy_remote.sh
          SFTP_SCRIPT
          echo "Deploy script uploaded."

      # ----------------------------------------------------
      # 7. EXECUTE THE DEPLOY SCRIPT IN ONE SSH SESSION
      # ----------------------------------------------------
      - name: Run Deploy Script on Server
        env:
          SSH_USER: ${{ secrets.SSH_USER || 'bismill6' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Executing remote deploy script..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            -o ConnectTimeout=30 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash /home/$SSH_USER/deploy_remote.sh && rm -f /home/$SSH_USER/deploy_remote.sh"
          echo "Remote deployment complete."
